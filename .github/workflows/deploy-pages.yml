name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ne pas annuler un déploiement en cours : sinon Pages peut rester
# verrouillé (« higher priority waiting request ») et le site en 404.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /Buddyboss/
          # GitHub Pages n'a pas de proxy Vite : URLs absolues vers WordPress Hostinger
          VITE_WP_API_URL: https://sandybrown-rail-456461.hostingersite.com/wp-json
          VITE_APP_API_URL: https://sandybrown-rail-456461.hostingersite.com/wp-json/app/v1
          VITE_API_TIMEOUT: "15000"
      - name: Add .nojekyll and SPA fallback
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
